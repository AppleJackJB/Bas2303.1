name: DAST with OWASP ZAP

on:
  push:
    branches: [ add-dast-github ]
  pull_request:
    branches: [ main ]

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: ./target/*.jar

  zap-baseline:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifacts
          path: ./target

      - name: Create ZAP rules file
        run: touch zap-rules.tsv

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run application
        run: |
          java -jar target/*.jar &
          sleep 30

      - name: Make workspace writable for ZAP
        run: chmod -R 777 "$GITHUB_WORKSPACE"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        continue-on-error: true
        with:
          target: 'http://localhost:8080'
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-r zap-baseline-report.html'
          allow_issue_writing: false

      - name: Upload ZAP Baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html

  zap-api:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-artifacts
          path: ./target

      - name: Create ZAP rules file
        run: touch zap-rules.tsv

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run application
        run: |
          java -jar target/*.jar &
          sleep 30

      - name: Make workspace writable for ZAP
        run: chmod -R 777 "$GITHUB_WORKSPACE"

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        continue-on-error: true
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: 'openapi'
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-r zap-api-report.html'
          allow_issue_writing: false

      - name: Upload ZAP API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: zap-api-report.html