name: "SAST with Semgrep"

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build simulation
        run: echo "Build simulated for SAST demo"

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Semgrep SAST Scan
        run: |
          docker run -v $(pwd):/src returntocorp/semgrep semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-report.sarif
        continue-on-error: true
      
      - name: Check if SARIF file exists
        run: |
          echo "Checking for SARIF file..."
          ls -la semgrep-report.sarif || echo "File not found, creating empty..."
          # Если файла нет - создаём пустой
          if [ ! -f semgrep-report.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > semgrep-report.sarif
          fi
      
      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-report.sarif